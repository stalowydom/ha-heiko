<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <!-- Ogólny schemat: pompa ciepła -> zawór trójdrogowy -> wężownica zasobnika CWU albo obieg grzewczy.
       Odczyty nakłada karta picture-elements w panelu (pozycje w %). -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#18232b"/>
      <stop offset="1" stop-color="#0e161c"/>
    </linearGradient>
    <linearGradient id="unit" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#3a4650"/>
      <stop offset="0.5" stop-color="#4b5862"/>
      <stop offset="1" stop-color="#323d46"/>
    </linearGradient>
    <linearGradient id="tank" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e2553a"/>
      <stop offset="0.55" stop-color="#e98a3f"/>
      <stop offset="1" stop-color="#3f73d8"/>
    </linearGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#fff" stop-opacity="0.16"/>
      <stop offset="0.4" stop-color="#fff" stop-opacity="0.03"/>
      <stop offset="1" stop-color="#000" stop-opacity="0.18"/>
    </linearGradient>
    <radialGradient id="fan" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#202a31"/>
      <stop offset="1" stop-color="#11181d"/>
    </radialGradient>
  </defs>

  <rect width="1000" height="560" rx="18" fill="url(#bg)"/>
  <rect x="0" y="500" width="1000" height="60" fill="#0b1217"/>

  <g fill="none" stroke-linecap="round" stroke-linejoin="round">
    <!-- supply: pump -> valve -->
    <path d="M250 210 H330" stroke="#e8784a" stroke-width="10"/>
    <!-- valve -> DHW coil -->
    <path d="M330 210 V250 H450" stroke="#e8784a" stroke-width="8"/>
    <!-- valve -> heating circuit (over the tank) -->
    <path d="M330 210 V130 H505 M535 130 H700 V300 H730" stroke="#e8784a" stroke-width="8"/>
    <!-- returns: coil -> pump, heating -> pump -->
    <path d="M450 390 H360 V350 H250" stroke="#4fa3d9" stroke-width="10"/>
    <path d="M730 420 H700 V470 H360 V350" stroke="#4fa3d9" stroke-width="8"/>
    <!-- domestic hot water out / cold water in -->
    <path d="M520 160 V60 H730" stroke="#e8784a" stroke-width="6"/>
    <path d="M730 92 H640 V430 H590" stroke="#7fc6e8" stroke-width="5"/>
  </g>
  <!-- pipe hop where heating supply crosses hot-water outlet -->
  <path d="M505 130 Q520 108 535 130" fill="none" stroke="#e8784a" stroke-width="8" stroke-linecap="round"/>

  <!-- three-way valve -->
  <g transform="translate(330 210)">
    <path d="M-16 -10 L0 0 L-16 10 Z M16 -10 L0 0 L16 10 Z M-10 -16 L0 0 L10 -16 Z" fill="#c9d2d8" stroke="#0e161c" stroke-width="1.5"/>
    <circle r="5" fill="#0e161c" stroke="#c9d2d8" stroke-width="2"/>
  </g>

  <!-- outdoor unit -->
  <g>
    <rect x="40" y="140" width="210" height="300" rx="14" fill="url(#unit)" stroke="#5c6973" stroke-width="2"/>
    <rect x="40" y="140" width="210" height="300" rx="14" fill="url(#shine)"/>
    <circle cx="145" cy="275" r="82" fill="url(#fan)" stroke="#66737d" stroke-width="3"/>
    <g stroke="#7d8a94" stroke-width="2" opacity="0.65" fill="none">
      <circle cx="145" cy="275" r="66"/>
      <circle cx="145" cy="275" r="48"/>
      <circle cx="145" cy="275" r="30"/>
      <path d="M63 275 H227 M145 193 V357 M87 217 L203 333 M203 217 L87 333"/>
    </g>
    <circle cx="145" cy="275" r="12" fill="#9aa6af"/>
    <rect x="58" y="400" width="174" height="10" rx="5" fill="#2a343b"/>
    <rect x="60" y="440" width="20" height="40" fill="#2a343b"/>
    <rect x="210" y="440" width="20" height="40" fill="#2a343b"/>
  </g>

  <!-- DHW tank with lower coil -->
  <g>
    <rect x="450" y="160" width="140" height="300" rx="46" fill="url(#tank)" stroke="#8a96a0" stroke-width="3"/>
    <rect x="450" y="160" width="140" height="300" rx="46" fill="url(#shine)"/>
    <path d="M450 250 C560 244 560 268 466 274 C560 280 560 304 466 310 C560 316 560 340 466 346 C560 352 560 376 466 382 L450 390"
          fill="none" stroke="#f4c9a6" stroke-width="5" opacity="0.85"/>
    <rect x="475" y="460" width="10" height="24" fill="#2a343b"/>
    <rect x="555" y="460" width="10" height="24" fill="#2a343b"/>
  </g>

  <!-- hot water tap -->
  <g transform="translate(730 30)">
    <rect width="150" height="96" rx="14" fill="#1d2930" stroke="#46535c"/>
    <path d="M40 28 H92 a10 10 0 0 1 10 10 V52" fill="none" stroke="#b9c4cc" stroke-width="9" stroke-linecap="round"/>
    <path d="M102 58 q-5 14 0 26 q5 -12 0 -26" fill="#5cb8ea"/>
    <rect x="28" y="20" width="18" height="18" rx="4" fill="#b9c4cc"/>
  </g>

  <!-- heating circuit: radiator + floor loop -->
  <g transform="translate(730 250)">
    <rect width="240" height="200" rx="14" fill="#1d2930" stroke="#46535c"/>
    <g fill="#c9d2d8">
      <rect x="28" y="26" width="16" height="74" rx="6"/>
      <rect x="52" y="26" width="16" height="74" rx="6"/>
      <rect x="76" y="26" width="16" height="74" rx="6"/>
      <rect x="100" y="26" width="16" height="74" rx="6"/>
      <rect x="124" y="26" width="16" height="74" rx="6"/>
      <rect x="148" y="26" width="16" height="74" rx="6"/>
      <rect x="172" y="26" width="16" height="74" rx="6"/>
      <rect x="196" y="26" width="16" height="74" rx="6"/>
    </g>
    <path d="M24 130 H216 V146 H24 V162 H216 V178 H24" fill="none" stroke="#e8784a" stroke-width="5" stroke-linejoin="round" opacity="0.9"/>
  </g>

  <!-- captions -->
  <g fill="#aebdc8" font-size="17" text-anchor="middle">
    <text x="145" y="128">Pompa ciepła</text>
    <text x="805" y="146">CWU</text>
    <text x="850" y="472">Obieg grzewczy</text>
  </g>
  <text x="262" y="236" fill="#e8a27e" font-size="13">zasilanie</text>
  <text x="270" y="375" fill="#8ec4e6" font-size="13">powrót</text>
</svg>
