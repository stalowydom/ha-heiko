title: Pompa ciepła
views:
- title: Pompa ciepła
  path: pompa
  icon: mdi:heat-pump
  type: sections
  max_columns: 4
  badges:
  - type: entity
    entity: sensor.temperatura_zewnetrzna_finalna
    name: Na zewnątrz
    show_name: true
  - type: entity
    entity: sensor.tze284_dikb3dp6_ts0601_total_power
    name: Pobór
    show_name: true
    icon: mdi:flash
  - type: entity
    entity: sensor.temperatura_gorna_noel_sonoff_snzb_02ld
    name: CWU (góra)
    show_name: true
    icon: mdi:water-boiler
  - type: entity
    entity: select.heiko_tryb_pracy_pompy
    name: Tryb
    show_name: true
  - type: entity
    entity: sensor.heiko_harmonogram_status
    name: Harmonogram
    show_name: true
  sections:
  - type: grid
    column_span: 3
    cards:
    - type: heading
      heading: Instalacja
      icon: mdi:hvac
    - type: picture-elements
      image: data:image/svg+xml;base64,
      elements:
      - type: state-label
        entity: sensor.temperatura_gorna_noel_sonoff_snzb_02ld
        style:
          left: 60.2%
          top: 25.0%
          background: rgba(12,14,19,0.80)
          clip-path: inset(5px 1px round 999px)
          line-height: '1.25'
          color: '#f2f4f8'
          font-weight: '600'
          white-space: nowrap
          font-size: clamp(8px,1.8vw,19px)
      - type: state-label
        entity: sensor.temperatura_srodek_noel_sonoff_snzb_02ld
        style:
          left: 60.2%
          top: 50.9%
          background: rgba(12,14,19,0.80)
          clip-path: inset(5px 1px round 999px)
          line-height: '1.25'
          color: '#f2f4f8'
          font-weight: '600'
          white-space: nowrap
          font-size: clamp(8px,1.8vw,19px)
      - type: state-label
        entity: sensor.temperatura_dol_noel_sonoff_snzb_02ld
        style:
          left: 60.2%
          top: 76.8%
          background: rgba(12,14,19,0.80)
          clip-path: inset(5px 1px round 999px)
          line-height: '1.25'
          color: '#f2f4f8'
          font-weight: '600'
          white-space: nowrap
          font-size: clamp(8px,1.8vw,19px)
      - type: state-label
        entity: sensor.temperatura_cwu
        style:
          left: 34.0%
          top: 31.8%
          background: rgba(12,14,19,0.80)
          clip-path: inset(5px 1px round 999px)
          line-height: '1.25'
          color: '#ff9a85'
          font-weight: '600'
          white-space: nowrap
          font-size: clamp(6.5px,1.45vw,15px)
        prefix: 'zasilanie '
      - type: state-label
        entity: sensor.heiko_tui_woda_wejscie
        style:
          left: 34.0%
          top: 63.7%
          background: rgba(12,14,19,0.80)
          clip-path: inset(5px 1px round 999px)
          line-height: '1.25'
          color: '#8cc8ff'
          font-weight: '600'
          white-space: nowrap
          font-size: clamp(6.5px,1.45vw,15px)
        prefix: 'powrót '
      - type: state-label
        entity: sensor.maszynownia_czujnik_temperatury_cyrkulacja_cwu
        style:
          left: 76.0%
          top: 39.3%
          background: rgba(12,14,19,0.80)
          clip-path: inset(5px 1px round 999px)
          line-height: '1.25'
          color: '#c4cbda'
          font-weight: '600'
          white-space: nowrap
          font-size: clamp(6px,1.15vw,12px)
      - type: state-label
        entity: sensor.temperatura_zewnetrzna_finalna
        style:
          left: 15.1%
          top: 25.2%
          background: rgba(12,14,19,0.80)
          clip-path: inset(5px 1px round 999px)
          line-height: '1.25'
          color: '#c4cbda'
          font-weight: '600'
          white-space: nowrap
          font-size: clamp(6px,1.15vw,12px)
        prefix: 'na zewnątrz '
      - type: state-label
        entity: sensor.tze284_dikb3dp6_ts0601_total_power
        style:
          left: 10.5%
          top: 76.6%
          background: transparent
          clip-path: inset(5px 1px round 999px)
          line-height: '1.25'
          color: '#6ee79a'
          font-weight: '600'
          white-space: nowrap
          font-size: clamp(6.5px,1.45vw,15px)
      - type: state-label
        entity: sensor.heiko_sprezarka_czestotliwosc
        style:
          left: 19.8%
          top: 76.6%
          background: transparent
          clip-path: inset(5px 1px round 999px)
          line-height: '1.25'
          color: '#c4cbda'
          font-weight: '600'
          white-space: nowrap
          font-size: clamp(6.5px,1.45vw,15px)
      - type: state-label
        entity: select.heiko_tryb_pracy_pompy
        style:
          left: 15.1%
          top: 88.8%
          background: rgba(12,14,19,0.80)
          clip-path: inset(5px 1px round 999px)
          line-height: '1.25'
          color: '#f2f4f8'
          font-weight: '600'
          white-space: nowrap
          font-size: clamp(6.5px,1.45vw,15px)
      - type: state-label
        entity: sensor.heiko_harmonogram_status
        style:
          left: 15.1%
          top: 93.9%
          background: rgba(12,14,19,0.80)
          clip-path: inset(5px 1px round 999px)
          line-height: '1.25'
          color: '#c4cbda'
          font-weight: '600'
          white-space: nowrap
          font-size: clamp(6px,1.15vw,12px)
      - type: state-label
        entity: sensor.salonkuchnia_salon_temperatura
        style:
          left: 88.0%
          top: 45.4%
          background: rgba(12,14,19,0.80)
          clip-path: inset(5px 1px round 999px)
          line-height: '1.25'
          color: '#c4cbda'
          font-weight: '600'
          white-space: nowrap
          font-size: clamp(6px,1.15vw,12px)
        prefix: 'salon '
      - type: conditional
        conditions:
        - entity: binary_sensor.pompa_ciepla_status
          state: 'on'
        elements:
        - type: icon
          icon: mdi:fan
          tap_action:
            action: more-info
          entity: binary_sensor.pompa_ciepla_status
          style:
            left: 15.1%
            top: 38.4%
            color: '#4ade80'
            --mdc-icon-size: clamp(12px,3vw,32px)
            filter: 'drop-shadow(0 0 6px #4ade80)'
      - type: conditional
        conditions:
        - entity: binary_sensor.pompa_ciepla_status
          state: 'on'
        elements:
        - type: icon
          icon: mdi:fan
          tap_action:
            action: more-info
          entity: binary_sensor.pompa_ciepla_status
          style:
            left: 15.1%
            top: 60.4%
            color: '#4ade80'
            --mdc-icon-size: clamp(12px,3vw,32px)
            filter: 'drop-shadow(0 0 6px #4ade80)'
      - type: conditional
        conditions:
        - entity: sensor.heiko_odszranianie
          state: '1'
        elements:
        - type: icon
          icon: mdi:snowflake-melt
          tap_action:
            action: more-info
          entity: sensor.heiko_odszranianie
          style:
            left: 24.0%
            top: 25.2%
            color: '#7dd3fc'
            --mdc-icon-size: clamp(11px,2.4vw,24px)
            filter: 'drop-shadow(0 0 6px #7dd3fc)'
      - type: conditional
        conditions:
        - entity: sensor.heiko_tryb_pracy
          state: '1'
        elements:
        - type: icon
          icon: mdi:fire
          tap_action:
            action: more-info
          entity: sensor.heiko_tryb_pracy
          style:
            left: 76.0%
            top: 15.4%
            color: '#ff7a45'
            --mdc-icon-size: clamp(11px,2.4vw,24px)
            filter: 'drop-shadow(0 0 6px #ff7a45)'
      - type: conditional
        conditions:
        - entity: sensor.heiko_tryb_pracy
          state: '2'
        elements:
        - type: icon
          icon: mdi:heat-wave
          tap_action:
            action: more-info
          entity: sensor.heiko_tryb_pracy
          style:
            left: 47.0%
            top: 21.4%
            color: '#ff9f43'
            --mdc-icon-size: clamp(11px,2.4vw,24px)
            filter: 'drop-shadow(0 0 6px #ff9f43)'
      grid_options:
        columns: full
  - type: grid
    cards:
    - type: heading
      heading: Sterowanie
      icon: mdi:tune-variant
    - type: tile
      entity: select.heiko_tryb_pracy_pompy
      name: Tryb pracy
      icon: mdi:heat-pump-outline
      features:
      - type: select-options
      grid_options:
        columns: 12
      features_position: bottom
      vertical: false
    - type: tile
      entity: switch.heiko_pompa_wlaczona
      name: Pompa
      grid_options:
        columns: 6
    - type: tile
      entity: input_boolean.heiko_harmonogram
      name: Harmonogram
      grid_options:
        columns: 6
    - type: tile
      entity: input_datetime.heiko_ogrzewanie_od
      name: Ogrzewanie od
      icon: mdi:radiator
      grid_options:
        columns: 6
    - type: tile
      entity: input_datetime.heiko_auto_od
      name: Auto od
      icon: mdi:water-boiler
      grid_options:
        columns: 6
    - type: tile
      entity: sensor.heiko_harmonogram_status
      name: Status harmonogramu
      grid_options:
        columns: 12
  - type: grid
    column_span: 2
    cards:
    - type: heading
      heading: Bufor NOEL – 24 h
      icon: mdi:thermometer-water
    - type: history-graph
      hours_to_show: 24
      grid_options:
        columns: full
        rows: 5
      entities:
      - entity: sensor.temperatura_gorna_noel_sonoff_snzb_02ld
        name: Góra
      - entity: sensor.temperatura_srodek_noel_sonoff_snzb_02ld
        name: Środek
      - entity: sensor.temperatura_dol_noel_sonoff_snzb_02ld
        name: Dół
      - entity: sensor.temperatura_cwu
        name: Zasilanie z PC
      - entity: sensor.heiko_tw_zasobnik_cwu
        name: TW (sterownik)
    - type: history-graph
      hours_to_show: 24
      grid_options:
        columns: full
        rows: 2
      entities:
      - entity: select.heiko_tryb_pracy_pompy
        name: Tryb
      - entity: binary_sensor.pompa_ciepla_status
        name: Sprężarka
  - type: grid
    column_span: 2
    cards:
    - type: heading
      heading: Pompa – 24 h
      icon: mdi:chart-line
    - type: gauge
      entity: sensor.tze284_dikb3dp6_ts0601_total_power
      name: Pobór mocy
      min: 0
      max: 6000
      needle: true
      severity:
        green: 0
        yellow: 4000
        red: 5500
      grid_options:
        columns: 6
        rows: 3
    - type: gauge
      entity: sensor.heiko_sprezarka_czestotliwosc
      name: Sprężarka
      unit: Hz
      min: 0
      max: 100
      needle: true
      grid_options:
        columns: 6
        rows: 3
    - type: history-graph
      hours_to_show: 24
      grid_options:
        columns: full
        rows: 4
      entities:
      - entity: sensor.tze284_dikb3dp6_ts0601_total_power
        name: Pobór mocy
    - type: tile
      entity: sensor.pompa_ciepla_starty_dzis_co_cwu
      name: Starty dziś (CO / CWU)
      icon: mdi:restart
      grid_options:
        columns: 4
    - type: tile
      entity: sensor.pompa_ciepla_dzisiaj
      name: Praca dziś
      icon: mdi:timer-outline
      grid_options:
        columns: 4
    - type: tile
      entity: sensor.heiko_odszraniania_dzis
      name: Odszraniania dziś
      icon: mdi:snowflake-melt
      grid_options:
        columns: 4
  - type: grid
    column_span: 2
    cards:
    - type: heading
      heading: Zużycie energii
      icon: mdi:lightning-bolt
    - type: statistics-graph
      entities:
      - entity: sensor.tze284_dikb3dp6_ts0601_energia
        name: Pompa ciepła
        color: '#4ade80'
      stat_types:
      - change
      chart_type: bar
      period: day
      days_to_show: 14
      grid_options:
        columns: full
        rows: 5
    - type: horizontal-stack
      grid_options:
        columns: full
      cards:
      - type: tile
        entity: sensor.pompa_ciepla_zuzycie_w_miesiacu
        name: Ten miesiąc
        icon: mdi:calendar-month
        color: green
        vertical: true
      - type: tile
        entity: sensor.pompa_ciepla_srednio_dziennie_w_miesiacu
        name: Średnio / dzień
        icon: mdi:chart-bell-curve-cumulative
        color: green
        vertical: true
      - type: tile
        entity: sensor.pompa_ciepla_zuzycie_wczoraj
        name: Wczoraj
        icon: mdi:calendar-today
        color: green
        vertical: true
      - type: tile
        entity: sensor.pompa_ciepla_kwh_na_stopien
        name: kWh/stopień (wczoraj)
        icon: mdi:thermometer-lines
        color: green
        vertical: true
    - type: heading
      heading: Efektywność
      heading_style: subtitle
    - type: statistics-graph
      title: kWh na stopień różnicy temperatur
      entities:
      - entity: heiko_thermal:kwh_na_stopien
        name: kWh/K
        color: '#4ade80'
      stat_types:
      - mean
      chart_type: bar
      period: day
      days_to_show: 30
      grid_options:
        columns: full
        rows: 5
  - type: grid
    column_span: 2
    cards:
    - type: heading
      heading: Obieg czynnika
      icon: mdi:molecule
    - type: tile
      entity: sensor.heiko_td_temperatura_tloczenia
      name: Td tłoczenie
      grid_options:
        columns: 4
    - type: tile
      entity: sensor.heiko_ts_temperatura_ssania
      name: Ts ssanie
      grid_options:
        columns: 4
    - type: tile
      entity: sensor.heiko_tp_temperatura_parownika
      name: Tp parownik
      grid_options:
        columns: 4
    - type: tile
      entity: sensor.heiko_pd_cisnienie_tloczenia
      name: Pd
      grid_options:
        columns: 4
    - type: tile
      entity: sensor.heiko_ps_cisnienie_ssania
      name: Ps
      grid_options:
        columns: 4
    - type: tile
      entity: sensor.heiko_zawor_rozprezny_otwarcie
      name: EEV
      grid_options:
        columns: 4
    - type: tile
      entity: sensor.heiko_sprezarka_prad
      name: Prąd sprężarki
      grid_options:
        columns: 4
    - type: tile
      entity: sensor.heiko_wentylator_1
      name: Wentylator
      grid_options:
        columns: 4
    - type: tile
      entity: sensor.heiko_tuo_woda_wyjscie
      name: Tuo
      grid_options:
        columns: 4
