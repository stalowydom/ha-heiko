# Powiadomienie, gdy wzrośnie licznik czasu pracy którejś grzałki (AH / HWTBH / HBH).
# Wymaga script.pompa_powiadom z examples/packages/pompa_ciepla_alarmy.yaml.
# Wklej do automations.yaml albo dodaj w UI (Edytuj w YAML).
- id: 'heiko_grzalka_pracuje'
  alias: Pompa ciepła – grzałka pracuje
  description: Licznik czasu pracy grzałki wzrósł. Po powiadomieniu 30 min przerwy.
  triggers:
  - trigger: state
    entity_id:
    - sensor.heiko_grzalka_ah_czas_pracy
    - sensor.heiko_grzalka_hwtbh_czas_pracy
    - sensor.heiko_grzalka_hbh_czas_pracy
  conditions:
  - condition: template
    value_template: >-
      {{ trigger.from_state is not none and trigger.to_state is not none
         and trigger.from_state.state not in ['unknown', 'unavailable']
         and trigger.to_state.state not in ['unknown', 'unavailable']
         and trigger.to_state.state | float(0) > trigger.from_state.state | float(0) }}
  actions:
  - variables:
      tytul: Pompa ciepła – pracuje grzałka
      tresc: >-
        {{ trigger.to_state.name }}: {{ trigger.from_state.state | int(0) }} → {{ trigger.to_state.state | int(0) }} min.
        Tuo {{ states('sensor.heiko_tuo_woda_wyjscie') }}°C, na zewnątrz {{ states('sensor.heiko_temperatura_zewnetrzna') }}°C.
        Grzałki powinny pracować tylko awaryjnie – sprawdź błędy pompy.
  - action: script.pompa_powiadom
    data:
      tytul: '{{ tytul }}'
      tresc: '{{ tresc }}'
      id: heiko_grzalka
  - delay: '00:30:00'
  mode: single
  max_exceeded: silent
